<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maximiliano | Artwork</title>

    <style>

        /* Page */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
        }


        /* Header */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            background-color: #111;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #aaa;
        }


        /* Page title */

        .title {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .title h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aaa;
            font-size: 17px;
        }


        /* Artwork gallery */

        .gallery {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }


        /* Artwork images */

        .gallery img {
            width: 100%;
            height: 600px;
            object-fit: cover;

            border-radius: 8px;

            transition: transform 0.3s ease;
        }


        /* Image hover effect */

        .gallery img:hover {
            transform: scale(1.03);
        }


        /* Footer */

        footer {
            text-align: center;
            padding: 40px;
            color: #888;
        }


        /* Makes the gallery work better on phones */

        @media (max-width: 800px) {

            header {
                padding: 15px;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .gallery img {
                height: auto;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <div class="name">
            Maximiliano
        </div>

        <nav>

            <a href="index.html">Home</a>
            
            <a href="index2pencils.html">Pencils</a>

            <a href="index3interiors.html">Interiors</a>

            <a href="index5pinups.html">Pinups</a>
            
        </nav>

    </header>


    <!-- Page title -->

    <section class="title">

        <h1>Inks</h1>

        <p>A collection of my comic book Inking.</p>

    </section>


    <!-- Artwork -->

    <section class="gallery">


        <!-- Artwork 1 -->

        <img src="spideyinks.jpg"
             alt="Comic book artwork by Maximiliano">


        <!-- Artwork 2 -->

        <img src="doiwannaknowinks.jpg"
             alt="Comic book artwork by Maximiliano">


        <!-- Artwork 3 -->

        <img src="benreillyinks.jpg"
             alt="Comic book artwork by Maximiliano">


        <!-- Artwork 4 -->

        <img src="larptastic4inks.jpg"
             alt="Comic book artwork by Maximiliano">


        
    </section>


    <!-- Footer -->

    <footer id="contact">

        <p>© 2026 Maximiliano</p>

    </footer>


</body>

</html>
