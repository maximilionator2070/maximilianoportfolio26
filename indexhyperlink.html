<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maximiliano | Portfolio</title>

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 25px 50px;

            background-color: black;

            border-bottom: 1px solid #333;
        }


        /* Your name */

        .name {
            font-size: 28px;
            font-weight: bold;
        }


        /* Navigation links */

        nav a {
            margin-left: 25px;

            text-decoration: none;

            color: white;

            font-size: 16px;
        }


        /* Navigation hover effect */

        nav a:hover {
            color: #888;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        main {
            max-width: 1000px;

            margin: 0 auto;

            padding: 70px 30px;
        }


        /* =========================
           INTRODUCTION
        ========================= */

        .intro {
            text-align: center;

            margin-bottom: 70px;
        }


        .intro h1 {
            font-size: 48px;

            margin-bottom: 15px;
        }


        .intro p {
            font-size: 18px;

            line-height: 1.7;

            max-width: 700px;

            margin: 0 auto;

            color: #ddd;
        }


        /* =========================
           ARTWORK
        ========================= */

        .artwork {
            text-align: center;
        }


        .artwork h2 {
            font-size: 32px;

            margin-bottom: 35px;
        }


        /* Artwork container */

        .gallery {
            display: flex;

            gap: 30px;

            justify-content: center;

            flex-wrap: wrap;
        }


        /* Artwork images */

        .gallery img {
            width: 400px;

            max-width: 100%;

            height: auto;

            border-radius: 8px;

            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.15);
        }


        /* =========================
           ABOUT / DESCRIPTION
        ========================= */

        .description {
            margin-top: 70px;

            text-align: center;

            padding: 30px;

            border-top: 1px solid #333;
        }


        .description p {
            font-size: 17px;

            line-height: 1.8;

            max-width: 750px;

            margin: 0 auto 30px auto;

            color: #ddd;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            margin-top: 50px;

            background-color: black;

            border-top: 1px solid #333;

            color: #aaa;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }


            .name {
                font-size: 24px;
            }


            nav a {
                margin-left: 10px;

                font-size: 14px;
            }


            main {
                padding: 50px 20px;
            }


            .intro h1 {
                font-size: 38px;
            }


            .gallery img {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="name">
            Maximiliano
        </div>


        <nav>
            
            <a href="index.html">Home</a>

            <a href="index2pencils.html">Pencils</a>

            <a href="index3interiors.html">Interiors</a>

            <a href="index4inks.html">Inks</a>

            <a href="index5pinups.html">Pinups</a>
             
           
           
        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- INTRODUCTION -->

        <section class="intro" id="about">

            <h1>2025</h1>


            
        </section>



        <!-- ARTWORK -->

        <section class="artwork" id="artwork">

            <h2>May</h2>


            <div class="gallery">

                <img src="goonknight.jpeg" alt="crappy image of moon knight"> 

            </div>

        </section>



        <!-- DESCRIPTION -->

        <section class="description">

            <p>
                This bad boy was made a little over a year ago. Obviously a ton of terrible decisions made here but don't worry it gets <a href="indexhyperlink2.html">better.</a>
            </p>


            
        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    

       

    


</body>

</html>
